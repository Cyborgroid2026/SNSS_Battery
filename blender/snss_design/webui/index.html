<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNSS 설계 — 브라우저 속 Blender</title>
<link rel="stylesheet" href="/ui/app.css">
<script type="importmap">{"imports": {"three": "/vendor/three.module.js"}}</script>
</head>
<body>
<header id="top">
  <b class="brand">SNSS 설계 · Blender</b>
  <nav id="scenes"></nav>
  <span class="grow"></span>
  <label class="mode" title="같은 키 · 마우스로 수조 속 실제 존재를 살핌 — 회전 받침 · 받침 오르내림 · 보기 빛 (console.py)">
    <input type="checkbox" id="hw"> HW 뷰포트 (수조가 모니터)</label>
  <button id="bCheck">점검</button>
  <button id="bSC1">SC-1 로 빚기</button>
  <button id="bSC2">SC-2 로 빚기</button>
  <button id="bRender">Blender 렌더</button>
  <button id="bSave">저장</button>
</header>
<main>
  <aside id="outliner"><h3>아웃라이너</h3><div id="tree"></div></aside>
  <section id="view">
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <div id="busy" hidden>Blender 가 계산하는 중…</div>
    <figure id="shot" hidden><img alt="Blender 렌더"><figcaption>Blender 렌더 (EEVEE) — 누르면 닫힘</figcaption></figure>
  </section>
  <aside id="props">
    <h3>설계 값</h3><div id="dims"></div>
    <div id="procBox" hidden><h3>과정 (SD 에 구운 것) — 단계로 가기 · 반복 · 건너뛰기</h3><div id="proc"></div></div>
    <h3>고른 것</h3><div id="sel"><p class="dim">뷰포트에서 누르거나 아웃라이너에서 고르세요</p></div>
    <h3 id="hwH" hidden>HW 기록 (G-code)</h3><pre id="hwlog" hidden></pre>
    <h3>키맵 — Blender ↔ 수조 콘솔</h3><div id="keymap"></div>
  </aside>
</main>
<footer id="log"><span id="status">연결 중…</span><pre id="joblog"></pre></footer>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
