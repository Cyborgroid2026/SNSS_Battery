# eLabFTW 앞단 프록시 — 이 컴퓨터(127.0.0.1:3148)에서만 열림.
# eLabFTW 는 https 만 받으므로, 공식 문서의 리버스 프록시 방식대로 X-Forwarded-Proto: https 를 붙여 넘김.
# 그래서 인증서 없이 http://localhost:3148 을 VS Code 통합 브라우저에서 열 수 있음 (localhost 는 브라우저가 안전한 곳으로 봄).
server {
    listen 80;
    client_max_body_size 100m;
    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
