# SNSS 조각가 SC-1 — Klipper 설정 (조각가 고유 부분). 핀 이름은 예시 — 배선에 맞게 고칠 것.
# 스테퍼 8축: XY 2 + Z 3 + 원료 3. 가열·냉각 없음 (상온).

[printer]
kinematics: corexy
max_velocity: 60
max_accel: 800
max_z_velocity: 5

[z_tilt]
z_positions: -10,-10 | 150,-10 | 70,160
points: 10,10 | 130,10 | 70,130

[extruder]  # 가상 부피 축: 1 mm = 잉크 1 mm³ (모터 없음, 경로 계획용)
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 1000
nozzle_diameter: 0.41
filament_diameter: 1.1284  # 단면적 1 mm² → E(mm) = 부피(mm³)
max_extrude_cross_section: 5
heater_pin: PA2  # 히터 없음 (자리만)
sensor_type: temperature_host
control: watermark
min_temp: 0
max_temp: 60
min_extrude_temp: 0

[extruder_stepper feed_go]  # GO: 그래핀 산화물 수분산 10 mg/mL (선택 밸브 뒤 3통)
step_pin: PLACEHOLDER_GO_STEP
dir_pin: PLACEHOLDER_GO_DIR
microsteps: 16
rotation_distance: 573.0422  # 리드 2.0 × 단면적 286.52 mm²

[extruder_stepper feed_snss]  # SNSS: 멸균생리식염수 0.9 % NaCl (154 mM)
step_pin: PLACEHOLDER_SNSS_STEP
dir_pin: PLACEHOLDER_SNSS_DIR
microsteps: 16
rotation_distance: 573.0422  # 리드 2.0 × 단면적 286.52 mm²

[extruder_stepper feed_pva]  # PVA: 폴리비닐알코올 10 wt% 수용액
step_pin: PLACEHOLDER_PVA_STEP
dir_pin: PLACEHOLDER_PVA_DIR
microsteps: 16
rotation_distance: 573.0422  # 리드 2.0 × 단면적 286.52 mm²

[temperature_sensor chamber]
sensor_type: SHT3X
i2c_mcu: mcu
i2c_bus: i2c1

[output_pin go_plain]  # 핀치 밸브: GO (막용)
pin: PLACEHOLDER_VALVE_PLAIN
value: 0

[output_pin go_p]  # 핀치 밸브: GO + NBD (p형)
pin: PLACEHOLDER_VALVE_P
value: 0

[output_pin go_n]  # 핀치 밸브: GO + PEI (n형)
pin: PLACEHOLDER_VALVE_N
value: 0

[output_pin uv_light]  # 405 nm LED 링
pin: PB7
pwm: True
value: 0

[output_pin suction]  # 깎은 소재 흡입
pin: PB9
value: 0

[output_pin humidifier]
pin: PB10
value: 1

[output_pin trig_layer]  # D3 TTL · Q3 LVTTL — 층·획·깎기 시작마다 뒤집힘 (움직임 큐와 동기)
pin: PB11
value: 0

[output_pin charge_relay]  # A2 외부 충전원 ↔ 발 단자
pin: PB12
value: 0

[gcode_macro TRIG]
description: 트리거 출력 뒤집기 + 다리에 사건 알림 (시간 태거·카메라 동기)
variable_level: 0
gcode:
  {% set v = 1 - printer['gcode_macro TRIG'].level %}
  SET_PIN PIN=trig_layer VALUE={v}
  SET_GCODE_VARIABLE MACRO=TRIG VARIABLE=level VALUE={v}
  RESPOND PREFIX=snss MSG="TRIG {params.EVENT|default('layer')} {params.N|default(0)}"

[gcode_macro CHARGE]
description: 외부 충전원(A2)을 존재의 발 단자에 잇거나 뗌
gcode:
  SET_PIN PIN=charge_relay VALUE={params.ON|default(1)|int}

[gcode_macro MIX]
description: 펜 끝 섞는 비율 GO:SNSS:PVA (합 1) · GO 통 선택 · 빛
gcode:
  {% set g = params.GO|float %}{% set s = params.SNSS|float %}{% set p = params.PVA|float %}
  {% set v = params.VARIANT|default('plain') %}
  {% if g > 0.001 %}
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=feed_go DISTANCE={573.0422 / g}
    SYNC_EXTRUDER_MOTION EXTRUDER=feed_go MOTION_QUEUE=extruder
  {% else %}
    SYNC_EXTRUDER_MOTION EXTRUDER=feed_go MOTION_QUEUE=
  {% endif %}
  {% if s > 0.001 %}
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=feed_snss DISTANCE={573.0422 / s}
    SYNC_EXTRUDER_MOTION EXTRUDER=feed_snss MOTION_QUEUE=extruder
  {% else %}
    SYNC_EXTRUDER_MOTION EXTRUDER=feed_snss MOTION_QUEUE=
  {% endif %}
  {% if p > 0.001 %}
    SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=feed_pva DISTANCE={573.0422 / p}
    SYNC_EXTRUDER_MOTION EXTRUDER=feed_pva MOTION_QUEUE=extruder
  {% else %}
    SYNC_EXTRUDER_MOTION EXTRUDER=feed_pva MOTION_QUEUE=
  {% endif %}
  SET_PIN PIN=go_plain VALUE={1 if v == 'plain' else 0}
  SET_PIN PIN=go_p VALUE={1 if v == 'p' else 0}
  SET_PIN PIN=go_n VALUE={1 if v == 'n' else 0}
  SET_PIN PIN=uv_light VALUE={params.LIGHT|default(0)|float}
  PURGE

[gcode_macro PURGE]
description: 퍼지 컵 위에서 혼합기 안 이전 재료를 밀어냄
gcode:
  SAVE_GCODE_STATE NAME=purge
  G90
  G0 Z95 F600
  G0 X125 Y5 F3000
  G1 E3 F60
  RESTORE_GCODE_STATE NAME=purge MOVE=1

[gcode_macro CARVE]
description: 깎기 모드 — 흡입 켬/끔 (열 없음)
gcode:
  SET_PIN PIN=suction VALUE={params.ON|default(1)|int}

[gcode_macro CURE]
description: 숙성 — 상온 · 습한 방에서 기다림 (도펀트 흡착, 수소결합 안정)
gcode:
  G4 P{(params.S|float * 1000)|int}

[gcode_macro HEAL]
description: 붙인 면이 아물 때까지 누른 채 기다림
gcode:
  G4 P{(params.S|float * 1000)|int}

[gcode_macro SCAN]
description: 레이저 프로파일러로 작업물 겉면 읽기 (호스트 스크립트가 받음)
gcode:
  RESPOND MSG="SCAN_BEGIN"
  G0 X0 Y0 Z95 F3000
  G0 X120 F1200
  RESPOND MSG="SCAN_END"
